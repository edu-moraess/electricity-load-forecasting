name: Restore ZIP fixture

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor == 'edu-moraess'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct fixture from ZIP payload
        run: |
          mkdir -p tests/fixtures
          cat tools/fixture.partaa tools/fixture.partab | base64 -d | gzip -d > tests/fixtures/sample_merged_series.csv
          test "$(wc -c < tests/fixtures/sample_merged_series.csv)" -eq 51553
          test "$(wc -l < tests/fixtures/sample_merged_series.csv)" -eq 961
      - name: Commit fixture and clean transfer files
        run: |
          rm -f tools/fixture.partaa tools/fixture.partab .github/workflows/restore-fixture.yml
          git config user.name "edu-moraess"
          git config user.email "199427299+edu-moraess@users.noreply.github.com"
          git add -A
          git commit -m "sync: restore exact fixture from ZIP"
          git push origin HEAD:main
