name: Restore exact test fixture
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore CSV
        run: |
          base64 -d tools/fixture_payload.b64 > /tmp/fixture.csv.gz
          gunzip -c /tmp/fixture.csv.gz > tests/fixtures/sample_merged_series.csv
          test "$(wc -c < tests/fixtures/sample_merged_series.csv)" -eq 51553
          test "$(wc -l < tests/fixtures/sample_merged_series.csv)" -eq 961
      - name: Commit exact fixture on branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b fixture-exact
          git add tests/fixtures/sample_merged_series.csv
          git rm tools/fixture_payload.b64
          git rm .github/workflows/restore-fixture.yml
          git commit -m "fix: add exact test fixture CSV"
          git push origin fixture-exact
