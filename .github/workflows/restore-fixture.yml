name: Restore test fixture
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore fixture
        env:
          PAYLOAD: 
        run: |
          printf '%s' "$PAYLOAD" | base64 -d | gzip -d > tests/fixtures/sample_merged_series.csv
          test "$(wc -c < tests/fixtures/sample_merged_series.csv)" -eq 51553
          test "$(wc -l < tests/fixtures/sample_merged_series.csv)" -eq 961
      - name: Remove transfer workflow
        run: rm .github/workflows/restore-fixture.yml
      - name: Commit fixture and cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/fixtures/sample_merged_series.csv .github/workflows/restore-fixture.yml
          git commit -m "Add exact test fixture CSV"
          git push
